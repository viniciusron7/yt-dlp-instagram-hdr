name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - '3.10'
          - '3.11'
          - '3.12'
          - '3.13'
          - '3.14'

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Check plugin loading
        run: |
          python - <<'PY'
          from yt_dlp.extractor import gen_extractor_classes
          from yt_dlp.plugins import load_all_plugins
          from yt_dlp.postprocessor import get_postprocessor

          load_all_plugins()
          extractors = {cls.__name__ for cls in gen_extractor_classes()}
          expected = {'InstagramHDRIE', 'InstagramHDRStoryIE'}
          assert expected <= extractors, expected - extractors
          assert get_postprocessor('InstagramHDRVerify').__name__ == 'InstagramHDRVerifyPP'
          PY

  build:
    name: Build wheel
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel

      - name: Test built wheel
        run: |
          python -m pip install --force-reinstall dist/*.whl
          cd "$RUNNER_TEMP"
          python - <<'PY'
          from yt_dlp.extractor import gen_extractor_classes
          from yt_dlp.plugins import load_all_plugins
          from yt_dlp.postprocessor import get_postprocessor

          load_all_plugins()
          extractors = {cls.__name__ for cls in gen_extractor_classes()}
          expected = {'InstagramHDRIE', 'InstagramHDRStoryIE'}
          assert expected <= extractors, expected - extractors
          assert get_postprocessor('InstagramHDRVerify').__name__ == 'InstagramHDRVerifyPP'
          PY

      - name: Upload wheel
        uses: actions/upload-artifact@v7
        with:
          name: yt-dlp-instagram-hdr-wheel
          path: dist/*.whl
          if-no-files-found: error

