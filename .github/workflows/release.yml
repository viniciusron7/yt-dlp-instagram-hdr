name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test wheel
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Validate tag
        if: github.ref_type == 'tag'
        run: |
          python - <<'PY'
          import configparser
          import os

          config = configparser.ConfigParser()
          config.read('setup.cfg')
          version = config['metadata']['version']
          tag = os.environ['GITHUB_REF_NAME']
          if tag != f'v{version}':
              raise SystemExit(f'Tag {tag!r} does not match package version {version!r}')
          PY

      - name: Install package
        run: |
          python -m pip install --upgrade pip build twine
          python -m pip install .

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build wheel
        run: python -m build --wheel

      - name: Check package metadata
        run: python -m twine check dist/*

      - name: Test built wheel
        run: |
          python -m pip install --force-reinstall dist/*.whl
          cd "$RUNNER_TEMP"
          python - <<'PY'
          from yt_dlp.extractor import gen_extractor_classes
          from yt_dlp.plugins import load_all_plugins
          from yt_dlp.postprocessor import get_postprocessor

          load_all_plugins()
          extractors = {cls.__name__ for cls in gen_extractor_classes()}
          expected = {'InstagramHDRIE', 'InstagramHDRStoryIE'}
          assert expected <= extractors, expected - extractors
          assert get_postprocessor('InstagramHDRVerify').__name__ == 'InstagramHDRVerifyPP'
          PY

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: yt-dlp-instagram-hdr-wheel
          path: dist/*.whl
          if-no-files-found: error

  github-release:
    name: Publish GitHub release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download wheel
        uses: actions/download-artifact@v8
        with:
          name: yt-dlp-instagram-hdr-wheel
          path: dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.whl --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.whl \
              --verify-tag \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi

  pypi-publish:
    name: Publish to PyPI
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/yt-dlp-instagram-hdr
    permissions:
      id-token: write

    steps:
      - name: Download wheel
        uses: actions/download-artifact@v8
        with:
          name: yt-dlp-instagram-hdr-wheel
          path: dist

      - name: Publish wheel to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          print-hash: true
